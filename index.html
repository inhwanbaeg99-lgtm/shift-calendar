<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // 옛 깃허브 주소로 들어오면 새 주소로 (이 기기에 기억된 매장 코드는 주소에 실어 넘긴다)
      if (location.hostname.endsWith("github.io")) {
        var q = new URLSearchParams(location.search), code = null;
        try { code = localStorage.getItem("shift-calendar:store"); } catch (e) {}
        if (code && !q.get("s")) q.set("s", code);
        var qs = q.toString();
        location.replace("https://kokwork.web.app" + location.pathname.replace(/^\/shift-calendar/, "") + (qs ? "?" + qs : "") + location.hash);
      }
    </script>
    <title>콕</title>
    <meta name="apple-mobile-web-app-title" content="콕" />
    <meta name="description" content="알바생 출퇴근 체크 및 관리자 대시보드" />
    <meta name="theme-color" content="#f2f4f6" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="app.js"></script>
  </body>
</html>
