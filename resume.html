<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이력서 · 콕</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" />
    <style>
      :root {
        --bg: #f2f4f6;
        --paper: #fff;
        --ink: #191f28;
        --sub: #6b7684;
        --line: #e5e8eb;
        --field: #f2f4f6;
        --accent: #0ea5a0;
        --red: #e5484d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 140px;
      }
      .kakao-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #fff7d6;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .kakao-bar[hidden] {
        display: none;
      }
      .kakao-bar a {
        flex-shrink: 0;
        padding: 8px 12px;
        border-radius: 10px;
        background: #191f28;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .head h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .head p {
        margin: 4px 0 20px;
        color: var(--sub);
        font-size: 14px;
      }
      .card {
        margin-bottom: 12px;
        padding: 20px 18px;
        border-radius: 18px;
        background: var(--paper);
      }
      .card h2 {
        margin: 0 0 14px;
        font-size: 17px;
      }
      .card h2 small {
        font-weight: 400;
        color: var(--sub);
        font-size: 13px;
      }
      .f {
        display: block;
        margin-bottom: 14px;
      }
      .f:last-child {
        margin-bottom: 0;
      }
      .f > span {
        display: block;
        margin-bottom: 6px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--sub);
      }
      .f > span em,
      .agree em {
        font-style: normal;
        color: var(--red);
      }
      .f > span small {
        font-weight: 400;
      }
      input[type="text"],
      input[type="tel"],
      textarea {
        width: 100%;
        height: 52px;
        padding: 0 16px;
        border: 2px solid transparent;
        border-radius: 14px;
        background: var(--field);
        font: inherit;
        font-size: 17px;
        color: inherit;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      input:focus,
      textarea:focus {
        border-color: var(--accent);
        background: #fff;
      }
      input.bad {
        border-color: var(--red);
      }
      textarea {
        height: auto;
        min-height: 140px;
        padding: 14px 16px;
        line-height: 1.6;
        resize: vertical;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chips label {
        position: relative;
      }
      .chips input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .chips span {
        display: grid;
        place-items: center;
        min-width: 48px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--field);
        font-size: 16px;
        font-weight: 600;
        color: var(--sub);
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .chips input:checked + span {
        background: var(--accent);
        color: #fff;
      }
      .chips input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .days span {
        min-width: 0;
        padding: 0;
      }
      .career {
        padding: 14px;
        margin-bottom: 10px;
        border-radius: 14px;
        background: var(--field);
      }
      .career .f > span {
        font-size: 12.5px;
      }
      .career input[type="text"] {
        height: 46px;
        background: #fff;
        font-size: 16px;
      }
      .career-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 700;
      }
      .career-head button {
        border: 0;
        background: none;
        font: inherit;
        font-size: 14px;
        color: var(--sub);
        cursor: pointer;
      }
      .add-career {
        width: 100%;
        height: 48px;
        border: 2px dashed var(--line);
        border-radius: 14px;
        background: none;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--sub);
        cursor: pointer;
      }
      .add-career[hidden] {
        display: none;
      }
      .agree {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        cursor: pointer;
      }
      .agree input {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        margin: 0;
        accent-color: var(--accent);
      }
      .agree b {
        display: block;
        margin-bottom: 4px;
      }
      .agree small {
        display: block;
        font-size: 13px;
        line-height: 1.6;
        color: var(--sub);
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(rgba(242, 244, 246, 0), var(--bg) 35%);
      }
      .bar button {
        height: 56px;
        border: 0;
        border-radius: 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .send {
        flex: 1;
        max-width: 420px;
        background: #fee500;
        color: #191919;
        font-size: 17px;
      }
      .send:disabled {
        opacity: 0.6;
      }
      .more {
        width: 56px;
        background: var(--paper);
        color: var(--sub);
        font-size: 14px;
      }
      .menu {
        position: fixed;
        left: 16px;
        bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        z-index: 11;
        display: grid;
        min-width: 180px;
        padding: 6px;
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      @media (min-width: 600px) {
        .menu {
          left: calc(50% - 254px);
        }
      }
      .menu[hidden] {
        display: none;
      }
      .menu button {
        height: 46px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: none;
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      .menu button:hover {
        background: var(--field);
      }
      .menu .danger {
        color: var(--red);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 12px 18px;
        border-radius: 14px;
        background: #191f28;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        transform: translateX(-50%);
      }
      /* 미리보기 */
      .pv {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
        background: rgba(0, 0, 0, 0.6);
        overflow-y: auto;
      }
      .pv img {
        width: min(100%, 520px);
        height: auto;
        border-radius: 4px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        -webkit-touch-callout: default;
      }
      .pv-tip {
        margin: 0;
        color: #fff;
        font-size: 13px;
        opacity: 0.9;
        text-align: center;
      }
      .pv-actions {
        display: flex;
        gap: 8px;
        width: min(100%, 520px);
      }
      .pv-actions button {
        flex: 1;
        height: 52px;
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .pv-actions .ghost {
        flex: 0.6;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
      }
      .pv-actions .primary {
        background: #fee500;
        color: #191919;
      }

      /* ---------- A4 이력서 (사진 · 인쇄용, 794 x 1123) : 격식 있는 명조 양식 ---------- */
      .stage {
        position: fixed;
        left: -10000px;
        top: 0;
      }
      .a4 {
        width: 794px;
        height: 1123px;
        padding: 64px 64px 48px;
        background: #fff;
        color: #000;
        font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
        font-size: 14px;
      }
      .a4,
      .a4 * {
        letter-spacing: 0;
      }
      .a4 h1 {
        margin: 0 0 30px;
        font-size: 38px;
        font-weight: 800;
        text-align: center;
      }
      .a4 h2 {
        margin: 20px 0 6px;
        font-size: 15px;
        font-weight: 800;
      }
      .a4 table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        border: 2px solid #000;
      }
      .a4 th,
      .a4 td {
        height: 34px;
        padding: 5px 10px;
        border: 1px solid #000;
        vertical-align: middle;
        font-size: 14px;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .a4 th {
        width: 116px;
        background: #ececec;
        font-weight: 700;
        text-align: center;
      }
      .a4 td {
        text-align: left;
      }
      .a4 thead th {
        width: auto;
      }
      .a4 td.c {
        text-align: center;
      }
      .a4 .intro {
        height: 168px;
        padding: 10px 12px;
        vertical-align: top;
        white-space: pre-wrap;
        line-height: 1.7;
      }
      .a4 .agree-doc {
        margin: 14px 0 0;
        font-size: 13px;
      }
      .a4 .confirm {
        margin: 26px 0 0;
        text-align: center;
        font-size: 15px;
      }
      .a4 .date {
        margin: 16px 0 0;
        text-align: center;
        font-size: 15px;
      }
      .a4 .sign {
        margin: 18px 0 0;
        text-align: right;
        font-size: 15px;
      }
      .a4 .sign b {
        display: inline-block;
        min-width: 110px;
        text-align: center;
        font-weight: 700;
      }
      .a4 .to {
        margin: 22px 0 0;
        text-align: center;
        font-size: 20px;
        font-weight: 800;
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          background: #fff;
        }
        .wrap,
        .bar,
        .menu,
        .toast,
        .pv {
          display: none !important;
        }
        .stage {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="kakao-bar" id="kakao-bar" hidden>카카오톡 안에서는 사진 보내기가 안 될 수 있어요.<a id="open-out" href="#">다른 브라우저로 열기</a></p>
      <header class="head">
        <h1>이력서</h1>
        <p id="for">아르바이트 지원서 · 다 쓰고 아래 노란 버튼을 눌러 보내 주세요</p>
      </header>

      <form id="form" autocomplete="on" onsubmit="return false">
        <section class="card">
          <h2>기본 정보</h2>
          <label class="f"><span>이름 <em>*</em></span><input type="text" name="name" autocomplete="name" placeholder="홍길동" /></label>
          <label class="f"><span>생년월일</span><input type="text" name="birth" inputmode="numeric" placeholder="2005.03.14" maxlength="10" /></label>
          <label class="f"><span>연락처 <em>*</em></span><input type="tel" name="phone" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13" /></label>
          <label class="f"><span>사는 곳 <small>(동까지만)</small></span><input type="text" name="area" placeholder="춘천시 온의동" /></label>
          <label class="f"><span>학교 · 학력 <small>(선택)</small></span><input type="text" name="school" placeholder="○○대학교 2학년 휴학" /></label>
        </section>

        <section class="card">
          <h2>근무 희망</h2>
          <div class="f">
            <span>가능한 요일</span>
            <div class="chips days">
              <label><input type="checkbox" name="d1" /><span>월</span></label><label><input type="checkbox" name="d2" /><span>화</span></label><label><input type="checkbox" name="d3" /><span>수</span></label><label><input type="checkbox" name="d4" /><span>목</span></label><label><input type="checkbox" name="d5" /><span>금</span></label><label><input type="checkbox" name="d6" /><span>토</span></label><label><input type="checkbox" name="d0" /><span>일</span></label>
            </div>
          </div>
          <label class="f"><span>가능한 시간</span><input type="text" name="hours" placeholder="평일 18시~22시, 주말 종일" /></label>
          <label class="f"><span>언제부터 가능해요?</span><input type="text" name="start" placeholder="11월 1일부터" /></label>
          <div class="f">
            <span>얼마나 일할 수 있어요?</span>
            <div class="chips">
              <label><input type="radio" name="period" value="3개월 미만" /><span>3개월 미만</span></label><label><input type="radio" name="period" value="3~6개월" /><span>3~6개월</span></label><label><input type="radio" name="period" value="6개월 이상" /><span>6개월 이상</span></label><label><input type="radio" name="period" value="1년 이상" /><span>1년 이상</span></label>
            </div>
          </div>
          <div class="f">
            <span>보건증</span>
            <div class="chips">
              <label><input type="radio" name="health" value="있음" /><span>있음</span></label><label><input type="radio" name="health" value="없음" /><span>없음</span></label><label><input type="radio" name="health" value="발급 예정" /><span>발급 예정</span></label>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>경력 <small>(없으면 비워 두세요)</small></h2>
          <div id="careers"></div>
          <button type="button" class="add-career" id="add-career">+ 경력 추가</button>
        </section>

        <section class="card">
          <h2>자기소개</h2>
          <label class="f"><textarea name="intro" placeholder="성격, 지원 이유, 하고 싶은 말을 편하게 써 주세요."></textarea></label>
        </section>

        <section class="card">
          <label class="agree">
            <input type="checkbox" name="agree" />
            <div>
              <b>개인정보 수집 · 이용에 동의해요 <em>*</em></b>
              <small>매장은 채용 검토를 위해 이름, 생년월일, 연락처, 사는 곳, 학력, 경력, 근무 희망을 받아요. 채용하지 않으면 결정 후 바로 지우고, 채용하면 근로계약 관리 목적으로만 보관해요. 쓴 내용은 이 휴대폰에만 남고, 보내기 전까지 어디에도 올라가지 않아요.</small>
            </div>
          </label>
        </section>
      </form>
    </div>

    <div class="menu" id="menu" hidden>
      <button type="button" id="print">빈 양식 인쇄</button>
      <button type="button" id="save-img">사진으로 저장</button>
      <button type="button" class="danger" id="clear">모두 지우기</button>
    </div>
    <div class="bar">
      <button type="button" class="more" id="more" aria-label="더 보기">•••</button>
      <button type="button" class="send" id="send">카카오톡 전송하기</button>
    </div>
    <div class="stage" id="stage" aria-hidden="true"></div>

    <script>
      const KEY = "kok-resume";
      const $ = (s) => document.querySelector(s);
      const form = $("#form");
      const store = (new URLSearchParams(location.search).get("store") || "").slice(0, 40);
      if (store) {
        $("#for").textContent = `${store} 아르바이트 지원서 · 다 쓰고 아래 노란 버튼을 눌러 보내 주세요`;
        document.title = `이력서 · ${store}`;
      }
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      let toastTimer;
      const toast = (msg) => {
        document.querySelector(".toast")?.remove();
        const t = document.createElement("p");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.remove(), 2600);
      };

      // 카카오톡 안 브라우저는 사진 공유가 막혀 있을 수 있어서 바깥 브라우저로 열기 안내
      if (/KAKAOTALK/i.test(navigator.userAgent)) {
        $("#kakao-bar").hidden = false;
        $("#open-out").href = `kakaotalk://web/openExternal?url=${encodeURIComponent(location.href)}`;
      }

      // ---------- 경력 (최대 3개) ----------
      let careers = [];
      function drawCareers() {
        $("#careers").innerHTML = careers
          .map(
            (c, i) => `<div class="career">
              <div class="career-head">경력 ${i + 1}<button type="button" data-del="${i}">삭제</button></div>
              <label class="f"><span>근무한 곳</span><input type="text" data-c="${i}" data-k="w" value="${esc(c.w)}" placeholder="○○카페" /></label>
              <label class="f"><span>기간</span><input type="text" data-c="${i}" data-k="p" value="${esc(c.p)}" placeholder="2025.03 ~ 2025.12" /></label>
              <label class="f"><span>한 일</span><input type="text" data-c="${i}" data-k="j" value="${esc(c.j)}" placeholder="음료 제조, 계산" /></label>
            </div>`,
          )
          .join("");
        $("#add-career").hidden = careers.length >= 3;
      }
      $("#add-career").addEventListener("click", () => {
        careers.push({ w: "", p: "", j: "" });
        drawCareers();
        keep();
        $(`[data-c="${careers.length - 1}"]`)?.focus();
      });
      $("#careers").addEventListener("click", (e) => {
        const i = e.target.dataset?.del;
        if (i === undefined) return;
        careers.splice(Number(i), 1);
        drawCareers();
        keep();
      });
      $("#careers").addEventListener("input", (e) => {
        const { c, k } = e.target.dataset;
        if (c === undefined) return;
        careers[Number(c)][k] = e.target.value;
        keep();
      });

      // ---------- 이 기기에만 저장 ----------
      const fields = () => [...form.querySelectorAll("input[name], textarea[name]")];
      function values() {
        const v = { careers };
        for (const f of fields()) {
          if (f.type === "checkbox") v[f.name] = f.checked;
          else if (f.type === "radio") {
            if (f.checked) v[f.name] = f.value;
          } else v[f.name] = f.value.trim();
        }
        return v;
      }
      function keep() {
        try {
          localStorage.setItem(KEY, JSON.stringify(values()));
        } catch {}
      }
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
        careers = Array.isArray(saved.careers) ? saved.careers.slice(0, 3) : [];
        for (const f of fields()) {
          if (!(f.name in saved)) continue;
          if (f.type === "checkbox") f.checked = Boolean(saved[f.name]);
          else if (f.type === "radio") f.checked = saved[f.name] === f.value;
          else f.value = saved[f.name];
        }
      } catch {}
      if (!careers.length) careers = [{ w: "", p: "", j: "" }];
      drawCareers();

      // 숫자만 쳐도 모양 맞추기: 생년월일 2005.03.14, 연락처 010-1234-5678
      form.addEventListener("input", (e) => {
        const t = e.target;
        if (t.name === "birth") {
          const d = t.value.replace(/\D/g, "").slice(0, 8);
          t.value = [d.slice(0, 4), d.slice(4, 6), d.slice(6, 8)].filter(Boolean).join(".");
        }
        if (t.name === "phone") {
          const d = t.value.replace(/\D/g, "").slice(0, 11);
          t.value = d.length < 4 ? d : d.length < 8 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
        }
        t.classList.remove("bad");
        keep();
      });
      form.addEventListener("change", keep);

      // ---------- A4 이력서 (입력한 내용을 양식 칸에 채운다) ----------
      const DAYS = [["d1", "월"], ["d2", "화"], ["d3", "수"], ["d4", "목"], ["d5", "금"], ["d6", "토"], ["d0", "일"]];
      function a4(v) {
        const now = new Date();
        const filled = Boolean(v.name);
        const days = DAYS.filter(([k]) => v[k]).map(([, l]) => l).join(" · ");
        const cs = (v.careers || []).filter((c) => c.w || c.p || c.j);
        const rows = [...cs, {}, {}, {}].slice(0, 3);
        return `
          <div class="a4">
            <h1>이 &nbsp;력 &nbsp;서</h1>
            <h2>■ 인적사항</h2>
            <table>
              <tr><th>성 명</th><td>${esc(v.name)}</td><th>생년월일</th><td>${esc(v.birth)}</td></tr>
              <tr><th>연 락 처</th><td>${esc(v.phone)}</td><th>주 소</th><td>${esc(v.area)}</td></tr>
              <tr><th>학 력</th><td colspan="3">${esc(v.school)}</td></tr>
            </table>
            <h2>■ 희망 근무조건</h2>
            <table>
              <tr><th>근무 가능 요일</th><td colspan="3">${esc(days)}</td></tr>
              <tr><th>근무 가능 시간</th><td colspan="3">${esc(v.hours)}</td></tr>
              <tr><th>근무 시작일</th><td>${esc(v.start)}</td><th>근무 가능 기간</th><td>${esc(v.period)}</td></tr>
              <tr><th>보건증</th><td colspan="3">${esc(v.health)}</td></tr>
            </table>
            <h2>■ 경력사항</h2>
            <table>
              <thead><tr><th style="width: 32%">근무 기간</th><th style="width: 30%">근 무 처</th><th>담 당 업 무</th></tr></thead>
              <tbody>${rows.map((c) => `<tr><td class="c">${esc(c.p)}</td><td class="c">${esc(c.w)}</td><td>${esc(c.j)}</td></tr>`).join("")}</tbody>
            </table>
            <h2>■ 자기소개</h2>
            <table><tr><td class="intro">${esc(v.intro)}</td></tr></table>
            <p class="agree-doc">${v.agree ? "☑" : "☐"} 본인은 채용 검토를 위한 개인정보 수집 · 이용에 동의합니다.</p>
            <p class="confirm">위의 기재 사항은 사실과 다름없음을 확인합니다.</p>
            <p class="date">${filled ? `${now.getFullYear()}년 &nbsp;${now.getMonth() + 1}월 &nbsp;${now.getDate()}일` : "년 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일"}</p>
            <p class="sign">지원자 &nbsp;<b>${esc(v.name) || "&nbsp;"}</b> &nbsp;(서명 또는 인)</p>
            <p class="to">${esc(store ? `${store} 귀중` : "")}</p>
          </div>`;
      }

      let h2c = null;
      function loadH2c() {
        if (window.html2canvas) return Promise.resolve(window.html2canvas);
        if (h2c) return h2c;
        h2c = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
          s.onload = () => resolve(window.html2canvas);
          s.onerror = () => {
            h2c = null;
            reject(new Error("인터넷 연결을 확인해주세요."));
          };
          document.head.appendChild(s);
        });
        return h2c;
      }
      // A4(794x1123)를 화면 밖에 그려서 2배로 찍는다 → 1588x2246 사진
      async function makeImage(v) {
        const html2canvas = await loadH2c();
        const stage = $("#stage");
        stage.innerHTML = a4(v);
        await Promise.all(["400", "700", "800"].map((w) => document.fonts.load(`${w} 15px "Nanum Myeongjo"`, "이력서가나다")).map((p) => p.catch(() => null)));
        await document.fonts.ready;
        try {
          const canvas = await html2canvas(stage.firstElementChild, { scale: 2, backgroundColor: "#ffffff" });
          const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
          if (!blob) throw new Error("사진을 만들지 못했어요.");
          return new File([blob], `${v.name || "지원자"} 이력서.png`, { type: "image/png" });
        } finally {
          stage.innerHTML = "";
        }
      }

      function check(v) {
        const need = [];
        if (!v.name) need.push("name");
        if (v.phone.replace(/\D/g, "").length < 10) need.push("phone");
        for (const n of need) form.querySelector(`[name=${n}]`).classList.add("bad");
        if (need.length) {
          form.querySelector(`[name=${need[0]}]`).scrollIntoView({ block: "center", behavior: "smooth" });
          toast(need[0] === "name" ? "이름을 써 주세요." : "연락처를 써 주세요.");
          return false;
        }
        if (!v.agree) {
          form.querySelector("[name=agree]").scrollIntoView({ block: "center", behavior: "smooth" });
          toast("개인정보 수집 · 이용 동의에 체크해주세요.");
          return false;
        }
        return true;
      }

      function download(file) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file);
        a.download = file.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }

      // 미리보기 → 휴대폰은 공유창(카카오톡), 컴퓨터는 복사해서 카톡에 붙여넣기
      // (공유·복사는 버튼을 누른 순간에 해야 브라우저가 허락해서, 사진을 먼저 만들고 한 번 더 누르게 한다)
      function preview(file) {
        const url = URL.createObjectURL(file);
        // 휴대폰(손가락 터치)만 공유창, 컴퓨터는 복사 → 카톡 PC 에 붙여넣기
        const canShare = matchMedia("(pointer: coarse)").matches && Boolean(navigator.canShare?.({ files: [file] }));
        const canCopy = !canShare && Boolean(window.ClipboardItem && navigator.clipboard?.write);
        const mac = /Mac/.test(navigator.platform);
        const pv = document.createElement("div");
        pv.className = "pv";
        pv.innerHTML = `
          <img src="${url}" alt="이력서 미리보기" />
          <p class="pv-tip">${canShare ? "공유창에서 <b>카카오톡</b> → 매장 채팅방을 골라 보내 주세요." : canCopy ? `복사한 뒤 카카오톡 채팅방에 붙여넣기(${mac ? "⌘V" : "Ctrl+V"}) 하면 사진으로 보내져요.` : "사진 저장 후 카카오톡으로 보내 주세요. 사진을 길게 눌러 저장할 수도 있어요."}</p>
          <div class="pv-actions">
            <button type="button" class="ghost" data-pv="close">닫기</button>
            ${canShare ? `<button type="button" class="primary" data-pv="share">카카오톡 전송하기</button>` : canCopy ? `<button type="button" class="primary" data-pv="copy">복사하기</button>` : `<button type="button" class="primary" data-pv="save">사진 저장</button>`}
          </div>`;
        const close = () => {
          pv.remove();
          URL.revokeObjectURL(url);
        };
        pv.addEventListener("click", async (e) => {
          const a = e.target.closest("[data-pv]")?.dataset.pv;
          if (a === "close" || e.target === pv) return close();
          if (a === "share") {
            try {
              await navigator.share({ files: [file] });
              close();
            } catch (err) {
              if (err.name !== "AbortError") toast("보내지 못했어요. 사진을 길게 눌러 저장해 보내 주세요.");
            }
          }
          if (a === "copy") {
            try {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": file })]);
              toast("복사했어요. 카카오톡 채팅방에 붙여넣기 하세요");
            } catch {
              toast("복사하지 못했어요. ••• → 사진으로 저장 해 주세요.");
            }
          }
          if (a === "save") download(file);
        });
        document.body.appendChild(pv);
      }

      const send = $("#send");
      send.addEventListener("click", async () => {
        const v = values();
        if (!check(v)) return;
        send.disabled = true;
        send.textContent = "이력서 사진 만드는 중…";
        try {
          preview(await makeImage(v));
        } catch (err) {
          toast(err.message);
        } finally {
          send.disabled = false;
          send.textContent = "카카오톡 전송하기";
        }
      });

      // ••• : 빈 양식 인쇄 · 사진으로 저장 · 모두 지우기
      const menu = $("#menu");
      $("#more").addEventListener("click", (e) => {
        e.stopPropagation();
        menu.hidden = !menu.hidden;
      });
      document.addEventListener("click", (e) => {
        if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true;
      });
      $("#print").addEventListener("click", () => {
        menu.hidden = true;
        $("#stage").innerHTML = a4({ careers: [] });
        const t = document.title;
        document.title = "이력서";
        window.print();
        document.title = t;
        $("#stage").innerHTML = "";
      });
      $("#save-img").addEventListener("click", async () => {
        menu.hidden = true;
        const v = values();
        if (!check(v)) return;
        try {
          download(await makeImage(v));
        } catch (err) {
          toast(err.message);
        }
      });
      $("#clear").addEventListener("click", () => {
        menu.hidden = true;
        if (!confirm("쓴 내용을 모두 지울까요?")) return;
        try {
          localStorage.removeItem(KEY);
        } catch {}
        location.reload();
      });
    </script>
  </body>
</html>
