<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이력서 · 콕</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" />
    <style>
      :root {
        --bg: #fff;
        --paper: #fff;
        --ink: #191f28;
        --sub: #6b7684;
        --faint: #b0b8c1;
        --line: #e5e8eb;
        --field: #f2f4f6;
        --accent: #0ea5a0;
        --red: #f04452;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      .app {
        display: flex;
        flex-direction: column;
        overflow-x: clip; /* 넘어가는 애니메이션이 화면을 넓히지 않게 */
        max-width: 560px;
        min-height: 100%;
        margin: 0 auto;
      }
      /* 위: 뒤로 · 진행 막대 · ••• */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: env(safe-area-inset-top, 0px) 8px 0;
        background: var(--bg);
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: none;
        color: var(--ink);
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--field);
      }
      .icon-btn[hidden] {
        visibility: hidden;
        display: grid;
      }
      .bar-track {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--field);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 0.3s ease;
      }
      /* 질문 */
      .step {
        flex: 1;
        padding: 20px 24px 140px;
        animation: step-in 0.28s ease both;
      }
      .step.back {
        animation-name: step-back;
      }
      .step.still {
        animation: none;
      }
      @keyframes step-in {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
      }
      @keyframes step-back {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
      }
      .store {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
      }
      .q {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.02em;
        word-break: keep-all;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 15px;
        color: var(--sub);
        word-break: keep-all;
      }
      .fields {
        display: grid;
        gap: 28px;
        margin-top: 36px;
      }
      .f > span {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
      }
      .line-input {
        width: 100%;
        padding: 10px 0;
        border: 0;
        border-bottom: 2px solid var(--line);
        border-radius: 0;
        background: none;
        font: inherit;
        font-size: 22px;
        font-weight: 600;
        color: var(--ink);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s;
      }
      .line-input::placeholder {
        color: var(--faint);
        font-weight: 500;
      }
      .line-input:focus {
        border-bottom-color: var(--accent);
      }
      .line-input.bad {
        border-bottom-color: var(--red);
      }
      textarea.line-input {
        min-height: 180px;
        padding: 14px 16px;
        border: 2px solid var(--line);
        border-radius: 16px;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
        resize: vertical;
      }
      textarea.line-input:focus {
        border-color: var(--accent);
      }
      .err {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--red);
      }
      /* 고르는 버튼 */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chips.days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .chip {
        min-height: 52px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        background: var(--field);
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.12s, color 0.12s, transform 0.08s;
      }
      .chips.days .chip {
        padding: 0;
      }
      .chip:active {
        transform: scale(0.97);
      }
      .chip.on {
        background: var(--accent);
        color: #fff;
      }
      .chips.col {
        flex-direction: column;
      }
      .chips.col .chip {
        width: 100%;
        text-align: left;
      }
      /* 경력 */
      .career {
        padding: 18px;
        border-radius: 18px;
        background: var(--field);
      }
      .career .line-input {
        font-size: 18px;
        border-bottom-color: #dfe3e8;
      }
      .career-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        font-size: 14px;
        font-weight: 700;
        color: var(--sub);
      }
      .text-btn {
        border: 0;
        background: none;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--sub);
        cursor: pointer;
      }
      .add-career {
        width: 100%;
        height: 56px;
        border: 0;
        border-radius: 16px;
        background: var(--field);
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }
      /* 마지막 확인 */
      .review {
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
      }
      .review li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .review .k {
        flex: 0 0 88px;
        font-size: 15px;
        color: var(--sub);
      }
      .review .v {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        font-weight: 600;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .review .v.empty {
        font-weight: 500;
        color: var(--faint);
      }
      .review .go {
        color: var(--faint);
      }
      .agree {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-top: 24px;
        padding: 18px;
        border-radius: 18px;
        background: var(--field);
        cursor: pointer;
      }
      .agree .box {
        flex: 0 0 24px;
        height: 24px;
        border-radius: 8px;
        background: #d1d6db;
        display: grid;
        place-items: center;
        color: #fff;
        transition: background 0.12s;
      }
      .agree.on .box {
        background: var(--accent);
      }
      .agree b {
        display: block;
        font-size: 16px;
      }
      .agree small {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--sub);
      }
      /* 아래 버튼 */
      .cta {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(rgba(255, 255, 255, 0), #fff 30%);
      }
      .cta-inner {
        display: flex;
        gap: 8px;
        max-width: 520px;
        margin: 0 auto;
      }
      .cta button {
        flex: 1;
        height: 56px;
        border: 0;
        border-radius: 16px;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
      }
      .cta .skip {
        flex: 0 0 auto;
        padding: 0 22px;
        background: var(--field);
        color: var(--sub);
      }
      .cta .next {
        background: var(--accent);
        color: #fff;
      }
      .cta .next:disabled {
        opacity: 0.35;
      }
      .menu {
        position: fixed;
        top: calc(56px + env(safe-area-inset-top, 0px));
        right: max(12px, calc(50% - 268px));
        z-index: 11;
        display: grid;
        min-width: 180px;
        padding: 6px;
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      .menu[hidden] {
        display: none;
      }
      .menu button {
        height: 46px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: none;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .menu button:hover {
        background: var(--field);
      }
      .menu .danger {
        color: var(--red);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 12px 18px;
        border-radius: 14px;
        background: #191f28;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        transform: translateX(-50%);
      }
      @media (prefers-reduced-motion: reduce) {
        .step,
        .bar-fill {
          animation: none;
          transition: none;
        }
      }

      /* 미리보기 */
      .pv {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        overflow-y: auto;
      }
      .pv img {
        width: min(100%, 520px);
        height: auto;
        border-radius: 4px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        -webkit-touch-callout: default;
      }
      .pv-tip {
        margin: 0;
        color: #fff;
        font-size: 13px;
        opacity: 0.9;
        text-align: center;
      }
      .pv-actions {
        display: flex;
        gap: 8px;
        width: min(100%, 520px);
      }
      .pv-actions button {
        flex: 1;
        height: 52px;
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .pv-actions .ghost {
        flex: 0.6;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
      }
      .pv-actions .primary {
        background: var(--accent);
        color: #fff;
      }

      /* ---------- A4 이력서 (사진 · 인쇄용, 794 x 1123) : 격식 있는 명조 양식 ---------- */
      .stage {
        position: fixed;
        left: -10000px;
        top: 0;
      }
      .a4 {
        width: 794px;
        height: 1123px;
        padding: 64px 64px 48px;
        background: #fff;
        color: #000;
        font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
        font-size: 14px;
      }
      .a4,
      .a4 * {
        letter-spacing: 0;
      }
      .a4 h1 {
        margin: 0 0 30px;
        font-size: 38px;
        font-weight: 800;
        text-align: center;
      }
      .a4 h2 {
        margin: 20px 0 6px;
        font-size: 15px;
        font-weight: 800;
      }
      .a4 table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        border: 2px solid #000;
      }
      .a4 th,
      .a4 td {
        height: 34px;
        padding: 5px 10px;
        border: 1px solid #000;
        vertical-align: middle;
        font-size: 14px;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .a4 th {
        width: 116px;
        background: #ececec;
        font-weight: 700;
        text-align: center;
      }
      .a4 td {
        text-align: left;
      }
      .a4 thead th {
        width: auto;
      }
      .a4 td.c {
        text-align: center;
      }
      .a4 .intro {
        height: 270px;
        padding: 10px 12px;
        vertical-align: top;
        white-space: pre-wrap;
        line-height: 1.7;
      }
      .a4 .agree-doc {
        margin: 14px 0 0;
        font-size: 13px;
      }
      .a4 .ck {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin: 0 7px 0 1px;
        border: 1.5px solid #000;
        vertical-align: -1px;
      }
      .a4 .ck.on {
        background: #000;
      }
      .a4 .confirm {
        margin: 26px 0 0;
        text-align: center;
        font-size: 15px;
      }
      .a4 .date {
        margin: 30px 0 0;
        text-align: center;
        font-size: 15px;
      }
      .a4 .sign {
        margin: 18px 0 0;
        text-align: right;
        font-size: 15px;
      }
      .a4 .sign b {
        display: inline-block;
        min-width: 110px;
        text-align: center;
        font-weight: 700;
      }
      .a4 .to {
        margin: 22px 0 0;
        text-align: center;
        font-size: 20px;
        font-weight: 800;
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          background: #fff;
        }
        .app,
        .menu,
        .toast,
        .pv {
          display: none !important;
        }
        .stage {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>
    <div class="menu" id="menu" hidden>
      <button type="button" id="print">빈 양식 인쇄</button>
      <button type="button" id="save-img">사진으로 저장</button>
      <button type="button" class="danger" id="clear">모두 지우기</button>
    </div>
    <div class="stage" id="stage" aria-hidden="true"></div>

    <script>
      const KEY = "kok-resume";
      const $ = (s) => document.querySelector(s);
      const params = new URLSearchParams(location.search);
      let store = (params.get("store") || "").slice(0, 40);
      if (store) document.title = `이력서 · ${store}`;
      // 짧은 주소(?s=매장코드): 매장 이름은 공개된 매장 정보에서 불러온다
      const code = (params.get("s") || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12);
      if (code && !store) {
        fetch(`https://shift-calendar-e973e-default-rtdb.asia-southeast1.firebasedatabase.app/stores/${code}/meta/name.json`)
          .then((r) => (r.ok ? r.json() : null))
          .then((name) => {
            if (typeof name !== "string" || !name) return;
            store = name.slice(0, 40);
            document.title = `이력서 · ${store}`;
            render(0);
          })
          .catch(() => {});
      }
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      let toastTimer;
      const toast = (msg) => {
        document.querySelector(".toast")?.remove();
        const t = document.createElement("p");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.remove(), 2600);
      };
      const ICON_BACK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
      const ICON_GO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
      const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

      // ---------- 쓴 내용 (이 기기에만 저장) ----------
      let v = {};
      try {
        v = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
      } catch {}
      if (!Array.isArray(v.careers)) v.careers = [];
      v.careers = v.careers.filter((c) => c && (c.w || c.p || c.j)).slice(0, 3);
      const keep = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(v));
        } catch {}
      };

      // ---------- 한 화면에 질문 하나 ----------
      const DAY_KEYS = [["d1", "월"], ["d2", "화"], ["d3", "수"], ["d4", "목"], ["d5", "금"], ["d6", "토"], ["d0", "일"]];
      const STEPS = [
        { id: "name", q: "이름을 알려주세요", field: { k: "name", ph: "홍길동", ac: "name" }, need: () => Boolean(v.name?.trim()) },
        { id: "phone", q: "연락받을 번호를\n알려주세요", hint: "합격하면 이 번호로 연락드려요", field: { k: "phone", ph: "010-0000-0000", type: "tel", im: "numeric", ac: "tel" }, need: () => (v.phone ?? "").replace(/\D/g, "").length >= 10 },
        { id: "birth", q: "생년월일을 알려주세요", hint: "숫자만 써도 돼요 (예: 050314)", field: { k: "birth", ph: "2005.03.14", im: "numeric" } },
        { id: "area", q: "어디에 살아요?", hint: "동까지만 알려주세요", field: { k: "area", ph: "춘천시 온의동" } },
        { id: "days", q: "언제 일할 수 있어요?", hint: "가능한 요일을 모두 골라주세요" },
        { id: "start", q: "언제부터,\n얼마나 일할 수 있어요?" },
        { id: "health", q: "보건증이 있나요?", hint: "음식을 다루는 일이라 필요해요" },
        { id: "career", q: "일해 본 곳이 있나요?", hint: "없으면 다음을 눌러 넘어가도 괜찮아요" },
        { id: "school", q: "학교나 학력을\n알려주세요", hint: "적지 않아도 괜찮아요", field: { k: "school", ph: "○○대학교 2학년 휴학" } },
        { id: "intro", q: "하고 싶은 말을\n적어주세요", hint: "성격, 지원 이유 등 편하게 써 주세요" },
        { id: "review", q: "이대로 보낼까요?", hint: "고칠 곳을 누르면 바로 고칠 수 있어요" },
      ];
      const LAST = STEPS.length - 1;
      let at = Math.min(Math.max(0, Number(v.step) || 0), LAST);
      let fromReview = false;

      const lineInput = (f) =>
        `<input class="line-input" data-k="${f.k}" value="${esc(v[f.k] ?? "")}" placeholder="${esc(f.ph)}" type="${f.type ?? "text"}"${f.im ? ` inputmode="${f.im}"` : ""}${f.ac ? ` autocomplete="${f.ac}"` : ' autocomplete="off"'} />`;
      const chip = (k, val, label, multi = false) => {
        const on = multi ? Boolean(v[k]) : v[k] === val;
        return `<button type="button" class="chip${on ? " on" : ""}" data-chip="${k}" data-val="${esc(val)}"${multi ? " data-multi" : ""} aria-pressed="${on}">${esc(label)}</button>`;
      };

      function body(step) {
        if (step.field) return `<div class="fields"><label class="f">${lineInput(step.field)}</label></div>`;
        if (step.id === "days")
          return `<div class="fields">
            <div class="chips days">${DAY_KEYS.map(([k, l]) => chip(k, "1", l, true)).join("")}</div>
            <label class="f"><span>가능한 시간</span>${lineInput({ k: "hours", ph: "평일 18시~22시, 주말 종일" })}</label>
          </div>`;
        if (step.id === "start")
          return `<div class="fields">
            <label class="f"><span>시작할 수 있는 날</span>${lineInput({ k: "start", ph: "11월 1일부터" })}</label>
            <div class="f"><span>일할 수 있는 기간</span><div class="chips">${["3개월 미만", "3~6개월", "6개월 이상", "1년 이상"].map((x) => chip("period", x, x)).join("")}</div></div>
          </div>`;
        if (step.id === "health") return `<div class="fields"><div class="chips col">${["있음", "없음", "발급 예정"].map((x) => chip("health", x, x === "있음" ? "네, 있어요" : x === "없음" ? "아니요, 없어요" : "곧 발급받을 거예요")).join("")}</div></div>`;
        if (step.id === "career")
          return `<div class="fields">
            ${v.careers
              .map(
                (c, i) => `<div class="career">
                  <div class="career-head">경력 ${i + 1}<button type="button" class="text-btn" data-del="${i}">삭제</button></div>
                  <div class="fields" style="margin-top:8px;gap:18px">
                    <label class="f"><span>근무한 곳</span><input class="line-input" data-c="${i}" data-ck="w" value="${esc(c.w)}" placeholder="○○카페" autocomplete="off" /></label>
                    <label class="f"><span>기간</span><input class="line-input" data-c="${i}" data-ck="p" value="${esc(c.p)}" placeholder="2025.03 ~ 2025.12" autocomplete="off" /></label>
                    <label class="f"><span>한 일</span><input class="line-input" data-c="${i}" data-ck="j" value="${esc(c.j)}" placeholder="음료 제조, 계산" autocomplete="off" /></label>
                  </div>
                </div>`,
              )
              .join("")}
            ${v.careers.length < 3 ? `<button type="button" class="add-career" data-add-career>+ ${v.careers.length ? "경력 더 추가" : "경력 추가"}</button>` : ""}
          </div>`;
        if (step.id === "intro") return `<div class="fields"><textarea class="line-input" data-k="intro" placeholder="예: 카페에서 6개월 일해 봤고, 주말에도 일할 수 있어요.">${esc(v.intro ?? "")}</textarea></div>`;
        // 마지막: 쓴 내용 확인 + 동의
        const days = DAY_KEYS.filter(([k]) => v[k]).map(([, l]) => l).join(" · ");
        const careers = v.careers.filter((c) => c.w || c.p || c.j).map((c) => [c.w, c.p, c.j].filter(Boolean).join(" · ")).join("\n");
        const rows = [
          ["이름", v.name, "name"],
          ["연락처", fmtPhone(v.phone ?? ""), "phone"],
          ["생년월일", fmtBirth(v.birth ?? ""), "birth"],
          ["사는 곳", v.area, "area"],
          ["가능한 요일", [days, v.hours].filter(Boolean).join("\n"), "days"],
          ["시작 · 기간", [v.start, v.period].filter(Boolean).join(" · "), "start"],
          ["보건증", v.health, "health"],
          ["경력", careers, "career"],
          ["학력", v.school, "school"],
          ["하고 싶은 말", v.intro, "intro"],
        ];
        return `
          <ul class="review">${rows.map(([k, val, id]) => `<li data-goto="${id}"><span class="k">${k}</span><span class="v${val ? "" : " empty"}">${esc(val || "없음")}</span><span class="go">${ICON_GO}</span></li>`).join("")}</ul>
          <div class="agree${v.agree ? " on" : ""}" data-agree role="checkbox" aria-checked="${Boolean(v.agree)}" tabindex="0">
            <span class="box">${v.agree ? ICON_CHECK : ""}</span>
            <div><b>개인정보 수집 · 이용에 동의해요</b><small>채용 검토를 위해 위 내용을 매장에 보내요. 채용하지 않으면 결정 후 바로 지우고, 채용하면 근로계약 관리에만 써요.</small></div>
          </div>`;
      }

      function render(dir = 1) {
        const step = STEPS[at];
        const review = step.id === "review";
        const ok = step.need ? step.need() : true;
        $("#app").innerHTML = `
          <header class="top">
            <button type="button" class="icon-btn" data-back aria-label="이전"${at === 0 && !fromReview ? " hidden" : ""}>${ICON_BACK}</button>
            <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${((at + 1) / STEPS.length) * 100}%"></div></div>
            <button type="button" class="icon-btn" data-more aria-label="더 보기">•••</button>
          </header>
          <main class="step${dir < 0 ? " back" : dir === 0 ? " still" : ""}">
            ${at === 0 ? `<p class="store">${esc(store ? `${store} 아르바이트 지원` : "아르바이트 지원")}</p>` : ""}
            <h1 class="q">${esc(step.q).replace(/\n/g, "<br />")}</h1>
            ${step.hint ? `<p class="hint">${esc(step.hint)}</p>` : ""}
            ${body(step)}
          </main>
          <div class="cta"><div class="cta-inner">
            ${review ? `<button type="button" class="next" data-send>문자 전송하기</button>` : `<button type="button" class="next" data-next${ok ? "" : " disabled"}>${fromReview ? "확인" : "다음"}</button>`}
          </div></div>`;
        v.step = at;
        keep();
        // 입력칸이 있으면 바로 쓸 수 있게
        const first = $("#app .step input, #app .step textarea");
        if (first && !matchMedia("(pointer: coarse)").matches) first.focus({ preventScroll: true });
        else if (first && dir !== 0) setTimeout(() => first.focus({ preventScroll: true }), 300);
      }
      const go = (i, dir) => {
        at = Math.min(Math.max(0, i), LAST);
        render(dir);
        window.scrollTo(0, 0);
      };
      function next() {
        const step = STEPS[at];
        if (step.id === "birth" && v.birth) v.birth = fmtBirth(v.birth);
        if (step.id === "phone") v.phone = fmtPhone(v.phone ?? "");
        if (step.need && !step.need()) return;
        if (step.id === "career") v.careers = v.careers.filter((c) => c.w || c.p || c.j);
        if (fromReview) {
          fromReview = false;
          return go(LAST, 1);
        }
        go(at + 1, 1);
      }

      // ---------- 누르기 · 쓰기 ----------
      $("#app").addEventListener("click", (e) => {
        const t = e.target.closest("button, [data-goto], [data-agree]");
        if (!t) return;
        if (t.hasAttribute("data-back")) {
          if (fromReview) {
            fromReview = false;
            return go(LAST, -1);
          }
          return go(at - 1, -1);
        }
        if (t.hasAttribute("data-more")) {
          e.stopPropagation();
          $("#menu").hidden = !$("#menu").hidden;
          return;
        }
        if (t.hasAttribute("data-next")) return next();
        if (t.hasAttribute("data-send")) return send(t);
        if (t.dataset.chip) {
          const k = t.dataset.chip;
          if (t.hasAttribute("data-multi")) v[k] = !v[k];
          else v[k] = v[k] === t.dataset.val ? "" : t.dataset.val;
          keep();
          return render(0);
        }
        if (t.hasAttribute("data-add-career")) {
          v.careers.push({ w: "", p: "", j: "" });
          keep();
          render(0);
          $(`[data-c="${v.careers.length - 1}"]`)?.focus();
          return;
        }
        if (t.dataset.del !== undefined) {
          v.careers.splice(Number(t.dataset.del), 1);
          keep();
          return render(0);
        }
        if (t.dataset.goto) {
          fromReview = true;
          return go(STEPS.findIndex((s) => s.id === t.dataset.goto), -1);
        }
        if (t.hasAttribute("data-agree")) {
          v.agree = !v.agree;
          keep();
          return render(0);
        }
      });
      $("#app").addEventListener("input", (e) => {
        const t = e.target;
        if (t.dataset.k) {
          if (t.dataset.k === "phone" && !t.value.trim().startsWith("+")) t.value = fmtPhone(t.value);
          if (t.dataset.k === "birth") t.value = t.value.replace(/[^\d.\-/ ]/g, "").slice(0, 10);
          v[t.dataset.k] = t.value;
          t.classList.remove("bad");
        }
        if (t.dataset.c !== undefined) v.careers[Number(t.dataset.c)][t.dataset.ck] = t.value;
        keep();
        // 꼭 써야 하는 칸: 다 쓰면 다음 버튼이 켜진다
        const step = STEPS[at];
        const btn = $("#app [data-next]");
        if (btn && step.need) btn.disabled = !step.need();
      });
      $("#app").addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.k === "birth") v[t.dataset.k] = t.value = fmtBirth(t.value);
        if (t.dataset.k === "phone") v.phone = t.value = fmtPhone(t.value);
        keep();
      });
      $("#app").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing && e.target.matches("input.line-input")) {
          e.preventDefault();
          next();
        }
        if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-agree]")) {
          e.preventDefault();
          e.target.click();
        }
      });

      // 생년월일: 20021002 · 021002 · 2002-10-02 · 2002.10.2 → 2002.10.02
      function fmtBirth(v) {
        const s = String(v ?? "").trim();
        const parts = s.split(/[^\d]+/).filter(Boolean);
        let y, m, d;
        if (parts.length === 3) [y, m, d] = parts;
        else {
          const n = s.replace(/\D/g, "");
          if (n.length === 8) [y, m, d] = [n.slice(0, 4), n.slice(4, 6), n.slice(6)];
          else if (n.length === 6) [y, m, d] = [n.slice(0, 2), n.slice(2, 4), n.slice(4)];
          else return s;
        }
        if (y.length === 2) y = `${Number(y) > new Date().getFullYear() % 100 ? 19 : 20}${y}`;
        if (y.length !== 4 || !(m >= 1 && m <= 12) || !(d >= 1 && d <= 31)) return s;
        return `${y}.${String(Number(m)).padStart(2, "0")}.${String(Number(d)).padStart(2, "0")}`;
      }
      // 연락처: 01084864791 · 010 8486 4791 · +82 10-8486-4791 → 010-8486-4791
      function fmtPhone(v) {
        let n = String(v ?? "").replace(/\D/g, "");
        if (n.startsWith("82")) n = `0${n.slice(2)}`;
        n = n.slice(0, 11);
        if (n.length < 4) return n;
        if (n.length < 8) return `${n.slice(0, 3)}-${n.slice(3)}`;
        if (n.startsWith("02")) return `02-${n.slice(2, n.length - 4)}-${n.slice(-4)}`;
        return `${n.slice(0, 3)}-${n.slice(3, n.length - 4)}-${n.slice(-4)}`;
      }
      // ---------- A4 이력서 (입력한 내용을 양식 칸에 채운다) ----------
      const DAYS = [["d1", "월"], ["d2", "화"], ["d3", "수"], ["d4", "목"], ["d5", "금"], ["d6", "토"], ["d0", "일"]];
      function a4(v) {
        const now = new Date();
        const filled = Boolean(v.name);
        const days = DAYS.filter(([k]) => v[k]).map(([, l]) => l).join(" · ");
        const cs = (v.careers || []).filter((c) => c.w || c.p || c.j);
        const rows = [...cs, {}, {}, {}].slice(0, 3);
        return `
          <div class="a4">
            <h1>이 &nbsp;력 &nbsp;서</h1>
            <h2>■ 인적사항</h2>
            <table>
              <tr><th>성 명</th><td>${esc(v.name)}</td><th>생년월일</th><td>${esc(v.birth)}</td></tr>
              <tr><th>연 락 처</th><td>${esc(v.phone)}</td><th>주 소</th><td>${esc(v.area)}</td></tr>
              <tr><th>학 력</th><td colspan="3">${esc(v.school)}</td></tr>
            </table>
            <h2>■ 희망 근무조건</h2>
            <table>
              <tr><th>근무 가능 요일</th><td colspan="3">${esc(days)}</td></tr>
              <tr><th>근무 가능 시간</th><td colspan="3">${esc(v.hours)}</td></tr>
              <tr><th>근무 시작일</th><td>${esc(v.start)}</td><th>근무 가능 기간</th><td>${esc(v.period)}</td></tr>
              <tr><th>보건증</th><td colspan="3">${esc(v.health)}</td></tr>
            </table>
            <h2>■ 경력사항</h2>
            <table>
              <thead><tr><th style="width: 32%">근무 기간</th><th style="width: 30%">근 무 처</th><th>담 당 업 무</th></tr></thead>
              <tbody>${rows.map((c) => `<tr><td class="c">${esc(c.p)}</td><td class="c">${esc(c.w)}</td><td>${esc(c.j)}</td></tr>`).join("")}</tbody>
            </table>
            <h2>■ 자기소개</h2>
            <table><tr><td class="intro">${esc(v.intro)}</td></tr></table>
            <p class="agree-doc"><span class="ck${v.agree ? " on" : ""}"></span>본인은 채용 검토를 위한 개인정보 수집 · 이용에 동의합니다.</p>
            <p class="date">${filled ? `${now.getFullYear()}년 &nbsp;${now.getMonth() + 1}월 &nbsp;${now.getDate()}일` : "년 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일"}</p>
            <p class="sign">지원자 &nbsp;<b>${esc(v.name) || "&nbsp;"}</b> &nbsp;(서명 또는 인)</p>
          </div>`;
      }

      let h2c = null;
      function loadH2c() {
        if (window.html2canvas) return Promise.resolve(window.html2canvas);
        if (h2c) return h2c;
        h2c = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
          s.onload = () => resolve(window.html2canvas);
          s.onerror = () => {
            h2c = null;
            reject(new Error("인터넷 연결을 확인해주세요."));
          };
          document.head.appendChild(s);
        });
        return h2c;
      }
      // A4(794x1123)를 화면 밖에 그려서 2배로 찍는다 → 1588x2246 사진
      async function makeImage(v) {
        const html2canvas = await loadH2c();
        const stage = $("#stage");
        stage.innerHTML = a4(v);
        await Promise.all(["400", "700", "800"].map((w) => document.fonts.load(`${w} 15px "Nanum Myeongjo"`, "이력서가나다")).map((p) => p.catch(() => null)));
        await document.fonts.ready;
        try {
          const canvas = await html2canvas(stage.firstElementChild, { scale: 2, backgroundColor: "#ffffff" });
          const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
          if (!blob) throw new Error("사진을 만들지 못했어요.");
          return new File([blob], `${v.name || "지원자"} 이력서.png`, { type: "image/png" });
        } finally {
          stage.innerHTML = "";
        }
      }

      function download(file) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file);
        a.download = file.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }

      // 미리보기 → 휴대폰은 공유창(메시지), 컴퓨터는 복사해서 붙여넣기
      // (공유·복사는 버튼을 누른 순간에 해야 브라우저가 허락해서, 사진을 먼저 만들고 한 번 더 누르게 한다)
      function preview(file) {
        const url = URL.createObjectURL(file);
        // 휴대폰(손가락 터치)만 공유창, 컴퓨터는 복사해서 붙여넣기
        const canShare = matchMedia("(pointer: coarse)").matches && Boolean(navigator.canShare?.({ files: [file] }));
        const canCopy = !canShare && Boolean(window.ClipboardItem && navigator.clipboard?.write);
        const mac = /Mac/.test(navigator.platform);
        const pv = document.createElement("div");
        pv.className = "pv";
        pv.innerHTML = `
          <img src="${url}" alt="이력서 미리보기" />
          <p class="pv-tip">${canShare ? "공유창에서 <b>메시지</b>를 골라, <b>이 주소를 보내 준 번호</b>로 보내 주세요." : canCopy ? `복사한 뒤 메시지 창에 붙여넣기(${mac ? "⌘V" : "Ctrl+V"}) 해서 <b>이 주소를 보내 준 번호</b>로 보내 주세요.` : "사진을 저장한 뒤 <b>이 주소를 보내 준 번호</b>로 문자 보내 주세요. 사진을 길게 눌러 저장할 수도 있어요."}</p>
          <div class="pv-actions">
            <button type="button" class="ghost" data-pv="close">닫기</button>
            ${canShare ? `<button type="button" class="primary" data-pv="share">문자 전송하기</button>` : canCopy ? `<button type="button" class="primary" data-pv="copy">복사하기</button>` : `<button type="button" class="primary" data-pv="save">사진 저장</button>`}
          </div>`;
        const close = () => {
          pv.remove();
          URL.revokeObjectURL(url);
        };
        pv.addEventListener("click", async (e) => {
          const a = e.target.closest("[data-pv]")?.dataset.pv;
          if (a === "close" || e.target === pv) return close();
          if (a === "share") {
            try {
              await navigator.share({ files: [file] });
              close();
            } catch (err) {
              if (err.name !== "AbortError") toast("보내지 못했어요. 사진을 길게 눌러 저장해 보내 주세요.");
            }
          }
          if (a === "copy") {
            try {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": file })]);
              toast("복사했어요. 메시지 창에 붙여넣기 하세요");
            } catch {
              toast("복사하지 못했어요. ••• → 사진으로 저장 해 주세요.");
            }
          }
          if (a === "save") download(file);
        });
        document.body.appendChild(pv);
      }


      // ---------- 보내기 ----------
      const values = () => ({ ...v, birth: fmtBirth(v.birth ?? ""), phone: fmtPhone(v.phone ?? ""), careers: v.careers.filter((c) => c.w || c.p || c.j) });
      async function send(btn) {
        const val = values();
        if (!val.name?.trim()) {
          toast("이름을 써 주세요.");
          fromReview = true;
          return go(0, -1);
        }
        if (val.phone.replace(/\D/g, "").length < 10) {
          toast("연락처를 써 주세요.");
          fromReview = true;
          return go(1, -1);
        }
        if (!v.agree) {
          toast("개인정보 수집 · 이용 동의를 눌러주세요.");
          $("[data-agree]")?.scrollIntoView({ block: "center", behavior: "smooth" });
          return;
        }
        btn.disabled = true;
        btn.textContent = "이력서 사진 만드는 중…";
        try {
          preview(await makeImage(val));
        } catch (err) {
          toast(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "문자 전송하기";
        }
      }

      // ••• : 빈 양식 인쇄 · 사진으로 저장 · 모두 지우기
      const menu = $("#menu");
      document.addEventListener("click", (e) => {
        if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true;
      });
      $("#print").addEventListener("click", () => {
        menu.hidden = true;
        $("#stage").innerHTML = a4({ careers: [] });
        const t = document.title;
        document.title = "이력서";
        window.print();
        document.title = t;
        $("#stage").innerHTML = "";
      });
      $("#save-img").addEventListener("click", async () => {
        menu.hidden = true;
        const val = values();
        if (!val.name?.trim()) return toast("이름을 먼저 써 주세요.");
        try {
          download(await makeImage(val));
        } catch (err) {
          toast(err.message);
        }
      });
      $("#clear").addEventListener("click", () => {
        menu.hidden = true;
        if (!confirm("쓴 내용을 모두 지울까요?")) return;
        v = { careers: [] };
        keep();
        fromReview = false;
        go(0, -1);
      });

      render(0);
    </script>
  </body>
</html>
